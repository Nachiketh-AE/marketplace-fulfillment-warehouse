<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Marketplace Supply and Fulfillment Warehouse banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="0.55" stop-color="#10283f"/>
      <stop offset="1" stop-color="#123c52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c1dc"/>
      <stop offset="1" stop-color="#4f9cf9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1d3a55" stroke-width="1" opacity="0.5">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200"/>
    <path d="M150 0 V280 M300 0 V280 M450 0 V280 M600 0 V280 M750 0 V280 M900 0 V280 M1050 0 V280"/>
  </g>
  <!-- pipeline motif: generator -> raw -> staging -> core -> marts -> BI -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60"  y="180" width="130" height="44" rx="8" fill="#0e2c47" stroke="#22c1dc"/>
    <rect x="230" y="180" width="130" height="44" rx="8" fill="#0e2c47" stroke="#4f9cf9"/>
    <rect x="400" y="180" width="130" height="44" rx="8" fill="#0e2c47" stroke="#4f9cf9"/>
    <rect x="570" y="180" width="130" height="44" rx="8" fill="#0e2c47" stroke="#22c1dc"/>
    <rect x="740" y="180" width="130" height="44" rx="8" fill="#0e2c47" stroke="#4f9cf9"/>
    <rect x="910" y="180" width="150" height="44" rx="8" fill="#123c52" stroke="#22c1dc" stroke-width="2"/>
    <g font-size="15" fill="#d7e7f5" text-anchor="middle">
      <text x="125"  y="207">Generator</text>
      <text x="295"  y="207">PostgreSQL</text>
      <text x="465"  y="207">dbt core</text>
      <text x="635"  y="207">Facts / Dims</text>
      <text x="805"  y="207">Marts</text>
      <text x="985"  y="207">Metabase</text>
    </g>
    <g stroke="#5fb4d8" stroke-width="2" fill="none" opacity="0.9">
      <path d="M190 202 H226 M360 202 H396 M530 202 H566 M700 202 H736 M870 202 H906"/>
      <path d="M220 196 l8 6 -8 6 M390 196 l8 6 -8 6 M560 196 l8 6 -8 6 M730 196 l8 6 -8 6 M900 196 l8 6 -8 6"/>
    </g>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="90" font-size="40" font-weight="700" fill="#ffffff">Marketplace Supply &amp; Fulfillment Warehouse</text>
    <text x="62" y="128" font-size="19" fill="#8fd8e8">Bookings · Payments · Provider capacity — modeled separately, reconciled end-to-end</text>
    <rect x="60" y="146" width="560" height="6" rx="3" fill="url(#accent)"/>
    <text x="912" y="120" font-size="14" fill="#9fb6c9">Python · PostgreSQL · dbt · Metabase · GitHub Actions</text>
  </g>
</svg>
