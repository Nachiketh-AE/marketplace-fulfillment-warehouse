services:
  postgres:
    image: postgres:16
    container_name: mfw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_admin}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      PGPORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - mfw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse_admin} -d ${POSTGRES_DB:-warehouse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: mfw-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - mfw_metabase:/metabase-data

volumes:
  mfw_pgdata:
  mfw_metabase:
