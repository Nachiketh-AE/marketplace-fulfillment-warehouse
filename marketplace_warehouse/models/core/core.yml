version: 2

models:
  - name: dim_customer
    description: SCD Type 2 customer profile versions.
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]

  - name: dim_provider
    description: SCD Type 2 provider profile versions.
    columns:
      - name: provider_sk
        tests: [unique, not_null]
      - name: provider_id
        tests: [not_null]

  - name: dim_service
    description: Type 1 service catalog.
    columns:
      - name: service_sk
        tests: [unique, not_null]
      - name: service_category_id
        tests: [unique, not_null]

  - name: dim_location
    description: Type 1 neighborhood/service regions.
    columns:
      - name: location_sk
        tests: [unique, not_null]
      - name: location_id
        tests: [unique, not_null]

  - name: dim_date
    description: Calendar date dimension with YYYYMMDD integer key.
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: fct_booking
    description: One row per booking; reconstructed final lifecycle state.
    columns:
      - name: booking_id
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_sk
      - name: service_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_service')
              field: service_sk
      - name: location_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_sk
      - name: final_status
        tests:
          - not_null
          - accepted_values:
              values: ['CREATED','ACCEPTED','SCHEDULED','IN_PROGRESS','COMPLETED','CANCELLED','REJECTED','EXPIRED','NO_SHOW']

  - name: fct_booking_status_event
    description: One row per status transition (append-only history).
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: booking_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_booking')
              field: booking_id

  - name: fct_booking_reschedule_event
    description: One row per reschedule event.
    columns:
      - name: reschedule_event_id
        tests: [unique, not_null]
      - name: booking_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_booking')
              field: booking_id

  - name: fct_payment_attempt
    description: One row per payment attempt.
    columns:
      - name: payment_attempt_id
        tests: [unique, not_null]
      - name: booking_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_booking')
              field: booking_id

  - name: fct_payment
    description: One row per posted capture/refund/reversal.
    columns:
      - name: payment_event_id
        tests: [unique, not_null]
      - name: booking_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_booking')
              field: booking_id
      - name: signed_amount
        tests: [not_null]

  - name: fct_provider_payout
    description: One row per payout transaction.
    columns:
      - name: payout_id
        tests: [unique, not_null]
      - name: booking_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_booking')
              field: booking_id

  - name: fct_provider_availability
    description: One row per provider availability interval.
    columns:
      - name: availability_id
        tests: [unique, not_null]
      - name: provider_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_provider')
              field: provider_sk
      - name: interval_minutes
        tests: [not_null]

  - name: bridge_provider_eligibility
    description: One row per effective-dated eligibility interval.
    columns:
      - name: eligibility_id
        tests: [unique, not_null]
      - name: provider_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_provider')
              field: provider_sk
