version: 2

models:
  - name: int_booking_status_ordered
    description: >
      One booking status event with deterministic ordering
      (occurred_at, event_sequence, event_id) and transition-validity flag.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: is_valid_transition
        tests: [not_null]

  - name: int_booking_lifecycle
    description: One booking with reconstructed lifecycle timestamps and final status.
    columns:
      - name: booking_id
        tests: [unique, not_null]
      - name: final_status
        tests:
          - not_null
          - accepted_values:
              values: ['CREATED','ACCEPTED','SCHEDULED','IN_PROGRESS','COMPLETED','CANCELLED','REJECTED','EXPIRED','NO_SHOW']

  - name: int_booking_reschedule_reconstructed
    description: One booking with the current scheduled start derived from reschedules.
    columns:
      - name: booking_id
        tests: [unique, not_null]

  - name: int_payment_events_signed
    description: One posted payment event with signed balance effect.
    columns:
      - name: payment_event_id
        tests: [unique, not_null]
      - name: signed_amount
        tests: [not_null]

  - name: int_booking_financials
    description: One booking with financial aggregates and fee policy applied.
    columns:
      - name: booking_id
        tests: [unique, not_null]
      - name: gross_completed_gmv
        tests: [not_null]
      - name: net_completed_gmv
        tests: [not_null]

  - name: int_booking_economics
    description: One booking with net fee revenue and provider earnings.
    columns:
      - name: booking_id
        tests: [unique, not_null]

  - name: int_requested_demand_hourly
    description: One booking x hour-bucket overlap of requested service time.
    tests:
      - unique_combination:
          columns: [booking_id, hour_bucket_start_at]

  - name: int_eligible_capacity_hourly
    description: One availability interval x hour-bucket overlap (eligible OPEN only).
    tests:
      - unique_combination:
          columns: [availability_id, hour_bucket_start_at]

  - name: int_reserved_booking_minutes
    description: One booking x availability interval x hour bucket of reserved minutes.
